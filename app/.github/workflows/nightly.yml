name: Nightly

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC
  workflow_dispatch:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9

jobs:
  full-e2e:
    name: Full E2E matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm build:test
      - run: pnpm start:test &
      - run: sleep 5
      - run: pnpm test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.project }}
          path: playwright-report/

  mobile-e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm build:test
      - run: pnpm start:test &
      - run: sleep 5
      - run: pnpm test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-${{ matrix.project }}
          path: playwright-report/

  lighthouse-trends:
    name: Lighthouse Trends
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:test
      - run: pnpm start:test &
      - run: sleep 5
      - run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

  flaky-quarantine:
    name: Flake quarantine report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Compute flake rate
        run: node scripts/flake-report.mjs artifacts/

  metrics-aggregate:
    name: Weekly metrics
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * 1' # Mondays
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - run: pnpm metrics:aggregate
      - uses: actions/upload-artifact@v4
        with: { name: weekly-metrics, path: reports/metrics/ }
